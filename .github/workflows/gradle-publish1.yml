name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Auto-Structure App Directory
      run: |
        # app 폴더가 없으면 자동으로 구조를 정리해 줍니다
        if [ ! -d "app" ]; then
          mkdir -p app/src/main
          
          # src 폴더가 루트에 있다면 app 안으로 이동
          if [ -d "src" ]; then
            mv src app/
          else
            # 낱개로 풀려있는 res, AndroidManifest 등을 app/src/main 로 이동
            [ -d "res" ] && mv res app/src/main/
            [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/
            [ -d "java" ] && mv java app/src/main/
          fi
          
          # build.gradle 처리
          if [ -f "build.gradle" ]; then
            cp build.gradle app/build.gradle
          fi
        fi

        # settings.gradle 이 없으면 자동 생성
        if [ ! -f "settings.gradle" ]; then
          echo "include ':app'" > settings.gradle
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/app-debug.apk"
